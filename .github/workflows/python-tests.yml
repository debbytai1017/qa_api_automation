name: Python API Test

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  api-test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: practice

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

    ##########################################
    # Checkout
    ##########################################

    - name: Checkout
      uses: actions/checkout@v5

    ##########################################
    # Python
    ##########################################

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    ##########################################
    # PHP
    ##########################################

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.3"

    ##########################################
    # Composer
    ##########################################

    - name: Install Composer Packages
      working-directory: laravel
      run: composer install --no-interaction --prefer-dist

    ##########################################
    # Laravel .env
    ##########################################

    - name: Copy .env
      working-directory: laravel
      run: cp .env.example .env

    - name: Generate APP_KEY
      working-directory: laravel
      run: php artisan key:generate

    ##########################################
    # Configure Database
    ##########################################

    - name: Configure Database
      working-directory: laravel
      run: |
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
        sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=practice/' .env
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env

    ##########################################
    # Migration + Seeder
    ##########################################

    - name: Run Migration
      working-directory: laravel
      run: php artisan migrate:fresh --seed --force

    ##########################################
    # Start Laravel
    ##########################################

    - name: Start Laravel
      working-directory: laravel
      run: |
        php artisan serve \
          --host=127.0.0.1 \
          --port=8000 \
          > laravel.log 2>&1 &

        sleep 15

    ##########################################
    # Run Pytest
    ##########################################

    - name: Run pytest
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: practice
        DB_USERNAME: root
        DB_PASSWORD: root
      run: |
        pytest -v --alluredir=allure-results

    ##########################################
    # Install Allure CLI
    ##########################################

    - name: Install Allure CLI
      if: always()
      run: |
        npm install -g allure-commandline
        allure --version

    ##########################################
    # Generate Allure Single HTML Report
    ##########################################

    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results \
          --clean \
          --single-file \
          -o allure-report

    ##########################################
    # Upload Allure Raw Results
    ##########################################

    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
        if-no-files-found: warn

    ##########################################
    # Upload Allure HTML Report
    ##########################################

    - name: Upload Allure HTML Report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
        if-no-files-found: warn

    ##########################################
    # Upload Laravel Server Log
    ##########################################

    - name: Upload Laravel Server Log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: laravel-server-log
        path: laravel/laravel.log
        if-no-files-found: warn

    ##########################################
    # Upload Laravel Error Log
    ##########################################

    - name: Upload Laravel Error Log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: laravel-error-log
        path: laravel/storage/logs/laravel.log
        if-no-files-found: warn